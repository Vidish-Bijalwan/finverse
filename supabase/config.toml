# Supabase CLI config — minimal: only the Edge Function settings live here.
# Migrations are still applied by hand in the SQL Editor (see README);
# nothing in this file changes that. Sections not listed use CLI defaults.

[functions.market-data]
# Market data is public (Yahoo quotes, no user data, no secrets held here),
# so the function does not require a JWT — see the header comment in
# supabase/functions/market-data/index.ts for the full reasoning.
verify_jwt = false

[functions.ai-chat]
# AI chat reads USER data (transactions, budgets, goals, holdings) via
# PostgREST with the caller's JWT, so the gateway must verify the JWT
# before the function runs — the opposite of market-data. See the header
# comment in supabase/functions/ai-chat/index.ts for the full reasoning.
verify_jwt = true
